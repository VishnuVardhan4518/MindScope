<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Log in — MindScope</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

    <link
        rel="stylesheet"
        href="/static/css/auth.css"
    >

</head>


<body>

    <main class="auth-page">

        <div class="auth-container">

            <a
                href="/"
                class="auth-brand"
            >

                <span class="auth-brand-mark">
                    M
                </span>

                <span class="auth-brand-name">
                    MindScope
                </span>

            </a>


            <section class="auth-card">

                <h1 class="auth-heading">
                    Welcome back.
                </h1>

                <p class="auth-subtitle">
                    Sign in to continue your
                    wellness journey.
                </p>


                <div
                    id="authMessage"
                    class="auth-message"
                    role="alert"
                ></div>


                <form
                    id="loginForm"
                    class="auth-form"
                >

                    <div class="auth-field">

                        <label for="email">
                            Email
                        </label>

                        <input
                            id="email"
                            name="email"
                            type="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div class="auth-field">

                        <label for="password">
                            Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                id="password"
                                name="password"
                                type="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="passwordToggle"
                            >
                                Show
                            </button>

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="auth-button"
                        id="loginButton"
                    >
                        Log in →
                    </button>

                </form>


                <p class="auth-switch">

                    Don't have an account?

                    <a href="/signup">
                        Create one
                    </a>

                </p>


                <p class="auth-note">
                    Your password is securely protected
                    using one-way password hashing.
                </p>

            </section>

        </div>

    </main>


    <script src="/static/js/login.js"></script>

</body>

</html>
